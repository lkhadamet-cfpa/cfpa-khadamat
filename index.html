<form id="worker-request-form" onsubmit="submitWorkerRequest(event)">
    <div class="form-group">
        <label>الاسم واللقب:</label>
        <input type="text" id="req-name" required placeholder="اسمك الكامل">
    </div>
    <div class="form-group">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="req-email" required placeholder="example@gmail.com">
    </div>
    <div class="form-group">
        <label>موضوع الطلب:</label>
        <select id="req-subject">
            <option value="طلب سلفة مالية">طلب سلفة مالية</option>
            <option value="ملف صحي وعمليات">ملف صحي وعمليات جراحية وأشعة</option>
            <option value="منحة الوفاة أو الزواج">منحة الوفاة أو الزواج</option>
        </select>
    </div>
    <!-- حقل الملفات المطور -->
    <div class="form-group">
        <label>تحميل الوثائق (صورة/PDF):</label>
        <input type="file" id="req-file" accept="image/*,.pdf" onchange="previewFile(event)">
    </div>
    <div class="form-group">
        <label>تفاصيل الطلب:</label>
        <textarea id="req-details" required placeholder="اكتب تفاصيل طلبك..."></textarea>
    </div>
    <button type="submit" class="btn-submit" style="background: #003366;">إرسال الطلب وحفظه في لوحة الإدارة 📁</button>
</form>
