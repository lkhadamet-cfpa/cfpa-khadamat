<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1677ff">
<title>منصة الخدمات الاجتماعية - فضيلة سعدان</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f3f6fa;
    color:#263238;
    min-height:100vh;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:linear-gradient(135deg,#0d47a1,#1976d2,#00a884);
}

.login-card{
    width:100%;
    max-width:480px;
    background:white;
    border-radius:24px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.logo{
    width:85px;
    height:85px;
    border-radius:50%;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:linear-gradient(135deg,#e91e63,#ff9800,#4caf50,#2196f3);
    color:white;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.login-title{
    text-align:center;
    color:#0d47a1;
    font-size:23px;
    font-weight:bold;
}

.login-subtitle{
    text-align:center;
    margin:8px 0 20px;
    color:#607d8b;
    line-height:1.7;
}

.notice{
    background:#e3f2fd;
    border-right:5px solid #1976d2;
    padding:12px;
    border-radius:10px;
    margin-bottom:18px;
    line-height:1.7;
    font-size:14px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#37474f;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccd6df;
    border-radius:11px;
    outline:none;
    background:white;
    font-size:15px;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px rgba(25,118,210,.1);
}

.btn{
    border:0;
    padding:12px 17px;
    border-radius:11px;
    font-weight:bold;
    font-size:14px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:#1976d2;
    color:white;
}

.btn-success{
    background:#00a884;
    color:white;
}

.btn-danger{
    background:#e53935;
    color:white;
}

.btn-warning{
    background:#ff9800;
    color:white;
}

.btn-dark{
    background:#263238;
    color:white;
}

.btn-light{
    background:#eef3f7;
    color:#263238;
}

.full{
    width:100%;
}

.login-buttons{
    display:grid;
    gap:10px;
}

/* ================= APP ================= */

#app{
    min-height:100vh;
}

.topbar{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:white;
    padding:12px 16px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:white;
    color:#1976d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.brand-title{
    font-size:16px;
    font-weight:bold;
}

.brand-small{
    font-size:11px;
    opacity:.85;
    margin-top:2px;
}

.top-actions{
    display:flex;
    gap:7px;
    align-items:center;
}

.top-actions button{
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);
    color:white;
    padding:9px 11px;
    border-radius:9px;
}

.container{
    width:calc(100% - 24px);
    max-width:1200px;
    margin:18px auto;
}

.announcement{
    background:#fff8e1;
    border-right:5px solid #ff9800;
    border-radius:12px;
    padding:13px;
    margin-bottom:16px;
    line-height:1.7;
}

.welcome{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.welcome h2{
    color:#0d47a1;
    margin-bottom:7px;
}

.welcome p{
    color:#607d8b;
}

/* ================= CARDS ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin-bottom:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat{
    display:flex;
    align-items:center;
    gap:12px;
}

.stat-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:#e3f2fd;
}

.stat-number{
    font-size:23px;
    font-weight:bold;
    color:#0d47a1;
}

.stat-label{
    font-size:12px;
    color:#78909
