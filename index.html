<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات الاجتماعية - قطاع التكوين المهني بسكرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>لجنة الخدمات الاجتماعية - قطاع التكوين المهني (بسكرة)</h1>
    </header>

    <main class="container">
        <!-- نموذج تقديم الطلبات -->
        <section class="card">
            <h2 class="title">تقديم طلب جديد أو رفع ملفات</h2>
            <form action="https://formspree.io/f/mqkrvkpq" method="POST" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="الاسم واللقب" required style="width:100%; padding:10px; margin-bottom:10px;">
                <input type="email" name="email" placeholder="البريد الإلكتروني للرد" required style="width:100%; padding:10px; margin-bottom:10px;">
                <select name="type" style="width:100%; padding:10px; margin-bottom:10px;">
                    <option value="سلفة">طلب سلفة</option>
                    <option value="رحلة">طلب رحلة/اصطياف</option>
                    <option value="ملف_طبي">رفع ملف طبي/أشعة</option>
                    <option value="شكوى">شكوى/تذكير</option>
                </select>
                <textarea name="message" placeholder="تفاصيل الطلب أو الحالة الطارئة" style="width:100%; padding:10px; height:100px; margin-bottom:10px;"></textarea>
                <label>إرفاق وثائق (صور/PDF):</label>
                <input type="file" name="attachment" style="width:100%; margin-bottom:10px;">
                <button type="submit" style="background:#003366; color:white; padding:10px 20px; border:none; cursor:pointer; width:100%;">إرسال الطلب</button>
            </form>
        </section>
    </main>
</body>
</html>
