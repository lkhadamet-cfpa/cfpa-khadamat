<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#075985">

<title>منصة لجنة الخدمات الاجتماعية - فضيلة سعدان بسكرة</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif
}

body{
    background:#f1f5f9;
    color:#17202a;
    min-height:100vh
}

button,input,select,textarea{
    font-family:inherit
}

button{
    cursor:pointer
}

.hidden{
    display:none!important
}

a{
    color:inherit
}

/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:
    linear-gradient(135deg,#075985,#0f766e,#164e63)
}

.login-card{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 70px rgba(0,0,0,.28)
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    background:linear-gradient(
        135deg,
        #ef4444,
        #f59e0b,
        #10b981,
        #3b82f6
    );
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.15)
}

.login-title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:15px
}

.login-subtitle{
    text-align:center;
    color:#64748b;
    line-height:1.8;
    margin:8px 0 20px
}

.form-group{
    margin-bottom:14px
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px
}

input,select,textarea{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:12px;
    padding:12px;
    outline:none;
    background:white
}

input:focus,
select:focus,
textarea:focus{
    border-color:#0284c7;
    box-shadow:0 0 0 3px rgba(2,132,199,.1)
}

textarea{
    min-height:110px;
    resize:vertical
}

.primary-btn{
    background:#075985;
    color:white;
    border:none;
    width:100%;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
    font-size:15px
}

.primary-btn:hover{
    background:#0369a1
}

.secondary-btn{
    background:#e2e8f0;
    color:#17202a;
    width:100%;
    padding:12px;
    border:0;
    border-radius:12px;
    font-weight:bold
}

.demo-box{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:13px;
    padding:12px;
    margin-top:15px;
    line-height:1.8;
    font-size:13px
}

/* ================= TOP BAR ================= */

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:#075985;
    color:white;
    min-height:60px;
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 3px 15px rgba(0,0,0,.15)
}

.brand{
    font-weight:bold;
    font-size:16px
}

.top-actions{
    display:flex;
    align-items:center;
    gap:7px
}

.icon-btn{
    border:0;
    background:rgba(255,255,255,.15);
    color:white;
    padding:8px 11px;
    border-radius:10px
}

.icon-btn:hover{
    background:rgba(255,255,255,.25)
}

.badge{
    display:inline-flex;
    min-width:20px;
    height:20px;
    align-items:center;
    justify-content:center;
    background:#ef4444;
    border-radius:50%;
    font-size:11px;
    margin-right:3px
}

/* ================= LAYOUT ================= */

.container{
    width:min(1250px,95%);
    margin:20px auto
}

.welcome{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    margin-bottom:18px
}

.welcome h2{
    margin-bottom:7px
}

.muted{
    color:#64748b
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));
    gap:15px
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.06)
}

.card h3{
    margin-bottom:10px
}

.section{
    margin-top:18px
}

/* ================= SERVICES ================= */
